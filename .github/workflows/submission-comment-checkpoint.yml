name: Submission comment checkpoint

on:
  push:
    branches: ["feat/phase3-private-comments"]

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install locked backend dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Start disposable database and capture local settings
        run: |
          supabase start > /tmp/submission-comment-stack.log 2>&1
          python - <<'PY'
          import json
          import os
          import subprocess
          from urllib.parse import urlparse

          result = subprocess.run(["supabase", "status", "-o", "json"], capture_output=True, text=True, check=True)
          state = json.loads(result.stdout)
          assert urlparse(state["API_URL"]).hostname in {"localhost", "127.0.0.1", "::1"}
          assert urlparse(state["DB_URL"]).hostname in {"localhost", "127.0.0.1", "::1"}
          for name in ("SERVICE_ROLE_KEY", "ANON_KEY", "JWT_SECRET"):
              print("::add-mask::" + state[name])
          settings = {
              "SUPABASE_URL": state["API_URL"], "SUPABASE_DB_URL": state["DB_URL"],
              "SUPABASE_SERVICE_ROLE_KEY": state["SERVICE_ROLE_KEY"],
              "SUPABASE_ANON_KEY": state["ANON_KEY"], "SUPABASE_JWT_SECRET": state["JWT_SECRET"],
              "ENVIRONMENT": "test", "SCORING_ENGINE": "manual", "MODEL_ARTIFACT_PATH": "",
              "HTR_MODEL_ARTIFACT_PATH": "", "CORS_ALLOWED_ORIGINS": "http://localhost:3000",
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              for name, value in settings.items():
                  output.write(f"{name}={value}\n")
          PY
          supabase db reset --local
      - name: Verify exact upload storage behavior
        working-directory: backend
        run: uv run pytest tests/rls/test_submission_comments.py -v
      - name: Generate actual database types
        if: always() && env.SUPABASE_URL != ''
        run: supabase gen types typescript --local > /tmp/submission-comment-database.ts
      - uses: actions/upload-artifact@v4
        if: always() && env.SUPABASE_URL != ''
        with:
          name: submission-comment-database-types
          path: /tmp/submission-comment-database.ts
      - name: Stop disposable database
        if: always()
        run: supabase stop --no-backup
