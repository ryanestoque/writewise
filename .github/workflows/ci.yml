name: CI

on:
  push:
    branches: [ "main", "feat/phase3-assignment-deadlines", "feat/phase3-return-release", "feat/phase3-notifications-implementation", "feat/phase3-email-notifications", "feat/phase3-points-gradebook", "feat/phase3-private-comments" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node 24
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: "backend/uv.lock"

    - name: Setup Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        
    - name: Install Supabase CLI
      uses: supabase/setup-cli@v1
      with:
        version: 2.115.0
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Frontend Lint
      working-directory: ./frontend
      run: npm run lint

    - name: Frontend Type Check
      working-directory: ./frontend
      run: npx tsc --noEmit

    - name: Install Backend Dependencies
      working-directory: ./backend
      run: uv sync

    - name: Backend Lint (ruff)
      working-directory: ./backend
      run: uv run ruff check .

    - name: Start Ephemeral Supabase Stack
      run: |
        docker ps --format '{{.Names}} {{.Ports}}'
        ss -ltn '( sport = :54322 )'
        supabase start
        echo "SUPABASE_URL=$(supabase status -o json | jq -r '.API_URL')" >> $GITHUB_ENV
        echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status -o json | jq -r '.SERVICE_ROLE_KEY')" >> $GITHUB_ENV
        echo "SUPABASE_ANON_KEY=$(supabase status -o json | jq -r '.ANON_KEY')" >> $GITHUB_ENV
        echo "SUPABASE_JWT_SECRET=$(supabase status -o json | jq -r '.JWT_SECRET')" >> $GITHUB_ENV
        echo "SUPABASE_DB_URL=$(supabase status -o json | jq -r '.DB_URL')" >> $GITHUB_ENV
        echo "MODEL_ARTIFACT_PATH=test/model.keras" >> $GITHUB_ENV
        echo "HTR_MODEL_ARTIFACT_PATH=" >> $GITHUB_ENV
        echo "SCORING_ENGINE=manual" >> $GITHUB_ENV
        echo "CORS_ALLOWED_ORIGINS=http://localhost:3000" >> $GITHUB_ENV
      
    - name: Apply Migrations
      run: supabase db reset --local

    - name: Verify legacy assignment upgrade
      env:
        ENVIRONMENT: test
      run: |
        supabase db reset --local --version 0021
        cd backend
        uv run python tests/migrations/assignment_upgrade_check.py prepare --manifest /tmp/assignment-upgrade.json
        cd ..
        supabase migration up --local
        cd backend
        uv run python tests/migrations/assignment_upgrade_check.py verify --manifest /tmp/assignment-upgrade.json
        cd ..
        supabase db reset --local

    - name: Verify legacy result release upgrade
      env:
        ENVIRONMENT: test
      run: |
        supabase db reset --local --version 20261101132822
        cd backend
        uv run python tests/migrations/release_upgrade_check.py prepare --manifest /tmp/release-upgrade.json
        cd ..
        supabase migration up --local
        cd backend
        uv run python tests/migrations/release_upgrade_check.py verify --manifest /tmp/release-upgrade.json
        cd ..
        supabase db reset --local

    - name: Verify legacy notification upgrade
      env:
        ENVIRONMENT: test
      run: |
        supabase db reset --local --version 20261102112156
        cd backend
        uv run python tests/migrations/notification_upgrade_check.py prepare --manifest /tmp/notification-upgrade.json
        cd ..
        supabase migration up --local
        cd backend
        uv run python tests/migrations/notification_upgrade_check.py verify --manifest /tmp/notification-upgrade.json
        cd ..
        supabase db reset --local

    - name: Verify legacy email upgrade
      env:
        ENVIRONMENT: test
      run: |
        supabase db reset --local --version 20261103010004
        cd backend
        uv run python tests/migrations/email_upgrade_check.py prepare --manifest /tmp/email-upgrade.json
        cd ..
        supabase migration up --local
        cd backend
        uv run python tests/migrations/email_upgrade_check.py verify --manifest /tmp/email-upgrade.json
        cd ..
        supabase db reset --local

    - name: Verify legacy gradebook upgrade
      # The gradebook proof starts from the complete pre-gradebook email schema.
      # Run before the unchanged email network guard is replayed below.
      if: success()
      run: |
        supabase db reset --local --version 20261103132241
        cd backend
        ENVIRONMENT=test uv run python tests/migrations/gradebook_upgrade_check.py prepare --manifest /tmp/gradebook-upgrade.json
        if ENVIRONMENT=test uv run python tests/migrations/gradebook_upgrade_check.py schema --manifest /tmp/gradebook-upgrade.json; then
          exit 1
        fi
        cd ..
        supabase migration up --local
        cd backend
        ENVIRONMENT=test uv run python tests/migrations/gradebook_upgrade_check.py verify --manifest /tmp/gradebook-upgrade.json
        cd ..
        supabase db reset --local

    - name: Verify legacy private comment upgrade
      run: |
        supabase db reset --local --version 20261108062937
        cd backend
        ENVIRONMENT=test uv run python tests/migrations/comment_upgrade_check.py prepare --manifest /tmp/comment-upgrade.json
        if ENVIRONMENT=test uv run python tests/migrations/comment_upgrade_check.py schema --manifest /tmp/comment-upgrade.json; then
          exit 1
        fi
        cd ..
        supabase migration up --local
        cd backend
        ENVIRONMENT=test uv run python tests/migrations/comment_upgrade_check.py verify --manifest /tmp/comment-upgrade.json
        cd ..
        supabase db reset --local

    - name: Verify submission comment cutover and legacy-data rejection
      run: |
        supabase db reset --local --version 20261109131320
        cd backend
        ENVIRONMENT=test uv run python tests/migrations/submission_comment_upgrade_check.py prepare --manifest /tmp/submission-comment-upgrade.json
        if ENVIRONMENT=test uv run python tests/migrations/submission_comment_upgrade_check.py schema --manifest /tmp/submission-comment-upgrade.json; then
          exit 1
        fi
        cd ..
        supabase migration up --local
        cd backend
        ENVIRONMENT=test uv run python tests/migrations/submission_comment_upgrade_check.py verify --manifest /tmp/submission-comment-upgrade.json
        cd ..
        for legacy_kind in legacy-comment legacy-notice; do
          supabase db reset --local --version 20261109131320
          cd backend
          ENVIRONMENT=test uv run python tests/migrations/submission_comment_upgrade_check.py prepare --manifest /tmp/submission-comment-${legacy_kind}.json
          ENVIRONMENT=test uv run python tests/migrations/submission_comment_upgrade_check.py ${legacy_kind} --manifest /tmp/submission-comment-${legacy_kind}.json
          cd ..
          if supabase migration up --local > /tmp/submission-comment-blocked.log 2>&1; then
            echo 'Legacy conversation cutover unexpectedly succeeded'
            exit 1
          fi
          grep -F 'Submission comment cutover requires empty legacy conversations' /tmp/submission-comment-blocked.log
          cd backend
          ENVIRONMENT=test uv run python tests/migrations/submission_comment_upgrade_check.py blocked --manifest /tmp/submission-comment-${legacy_kind}.json
          cd ..
        done
        supabase db reset --local

    - name: Verify fail-closed network guard and owner provisioning
      run: |
        docker exec -i supabase_db_writewise-test psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < backend/tests/migrations/email_network_guard_check.sql
        docker exec -i supabase_db_writewise-test psql -X -v ON_ERROR_STOP=1 -U supabase_admin -d postgres < supabase/migrations/20261103132241_phase3_email_network_boundary.sql

    - name: Check generated API contract
      env:
        ENVIRONMENT: test
      run: |
        cd backend
        uv run python - <<'PY'
        import json
        from pathlib import Path
        from app.main import app
        Path('/tmp/writewise-openapi.json').write_text(json.dumps(app.openapi()), encoding='utf-8')
        PY
        cd ../frontend
        npx --yes openapi-typescript@7.13.0 /tmp/writewise-openapi.json -o types/api.ts
        git diff --exit-code -- types/api.ts

    - name: Generate database contract
      run: supabase gen types typescript --local > frontend/types/database.ts

    - name: Upload generated database contract
      uses: actions/upload-artifact@v4
      with:
        name: database-types
        path: frontend/types/database.ts

    - name: Start synthetic email callback
      run: |
        docker inspect supabase_db_writewise-test >/dev/null
        docker run --detach --rm --name writewise-email-callback \
          --network container:supabase_db_writewise-test \
          --mount type=bind,src="$PWD/backend/tests/support/email_callback.py",dst=/callback.py,readonly \
          python:3.13-slim python /callback.py

    - name: Run Backend Pytest
      working-directory: ./backend
      env:
        ENVIRONMENT: test
      run: uv run pytest

    - name: Check database security advisors
      run: supabase db advisors --local --type security --level warn --fail-on error

    - name: Check committed database contract
      run: git diff --exit-code -- frontend/types/database.ts
      
    - name: Stop synthetic email callback
      if: always()
      run: |
        if docker container inspect writewise-email-callback >/dev/null 2>&1; then
          docker container rm --force writewise-email-callback
        fi

    - name: Teardown Supabase
      if: always()
      run: |
        if command -v supabase >/dev/null 2>&1; then
          supabase stop
        fi
